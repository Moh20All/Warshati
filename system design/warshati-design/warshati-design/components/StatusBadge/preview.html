<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>StatusBadge — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
var rows=[['ticket','Repair ticket'],['priority','Priority'],['debt','Debt status'],['payment','Payment history'],['po','Purchase order payment'],['sale','Sale status'],['condition','Trade-in condition'],['tradein','Trade-in status'],['checkin','Check-in'],['warranty','Warranty'],['followup','Warranty follow-up'],['stock','Stock'],['user','User status'],['vfm','Value for money']];
mount(h('div',{className:'w-root pv',style:{gap:8}},rows.map(k=>h('div',{key:k[0],style:{display:'grid',gridTemplateColumns:'170px 1fr 1fr',gap:12,alignItems:'center',paddingBottom:6,borderBottom:'1px solid var(--color-border)'}},
  h('div',{className:'w-label'},k[1]),
  h('div',{className:'w-row',style:{gap:5}},Object.keys(W.STATUS[k[0]]).map(v=>h(W.StatusBadge,{key:v,kind:k[0],value:v,lang:'en'}))),
  h('div',{className:'w-row',dir:'rtl',style:{gap:5}},Object.keys(W.STATUS[k[0]]).map(v=>h(W.StatusBadge,{key:v,kind:k[0],value:v,lang:'ar'})))))));
</script>
</body>
</html>
