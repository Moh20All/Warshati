<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Modal — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
mount(h('div',{className:'w-root pv',style:{background:'var(--color-overlay)',display:'grid',placeItems:'center',height:330}},
  h(W.Modal,{size:'md',title:'Record Payment',footer:h(F,null,h(W.Button,{variant:'outline'},'Cancel'),h(W.Button,null,'Record'))},
    h('div',{className:'w-row',style:{justifyContent:'space-between'}},h('span',null,'Mourad Kacemi'),h('span',null,'Remaining: ',h('b',null,M(6000)))),
    h(W.MoneyInput,{label:'Payment Amount (DZD)',placeholder:6000}))));
</script>
</body>
</html>
