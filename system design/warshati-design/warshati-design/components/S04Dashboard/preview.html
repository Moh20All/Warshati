<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S04Dashboard — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

var q=[['plus','New Ticket'],['cart','New Sale'],['user','Add Customer'],['cash','Add Expense'],['receipt','Daily Close']];
mount(shell({active:'dashboard',crumbs:['Dashboard']},[
  h(W.PageHeader,{key:1,title:'Welcome back, Karim',subtitle:'Saturday, October 24, 2026',actions:h(W.Button,{variant:'outline',icon:'print'},'Print Overview')}),
  h('div',{key:2,className:'w-row'},q.map((x,i)=>h(W.Button,{key:i,variant:i===0?'primary':'secondary',size:'sm',icon:x[0]},x[1]))),
  h(F,{key:3},grid(4,[h(W.StatCard,{key:1,icon:'wrench',label:'Pending Repairs',value:'17',sub:'5 ready for pickup',subTone:'success'}),h(W.StatCard,{key:2,tone:'key',icon:'chart',label:'Today\'s Net Profit',value:M(31200),sub:'12 sales, 4 delivered repairs'}),h(W.StatCard,{key:3,icon:'wallet',label:'Outstanding Debt',value:M(124000),sub:'9 entries'}),h(W.StatCard,{key:4,icon:'box',label:'Low Stock Items',value:'7'})])),
  h(F,{key:4},grid(2,[
    h(W.Card,{key:1,title:'Recent Tickets',flush:true,actions:h('a',{href:'#',className:'w-cap',style:{color:'var(--color-primary)'}},'View all')},h(W.Table,{clickable:true,columns:[{label:''},{label:''},{label:'',end:true}],rows:[
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('TKT-2026-0187'),C('ticket','in-repair'),C('priority','urgent')),h('span',{className:'w-sub'},'Amina Haddad · Samsung Galaxy A54')),'',h('div',null,M(12500),h('span',{className:'w-sub'},'2d ago'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('TKT-2026-0186'),C('ticket','waiting-parts'),C('priority','normal')),h('span',{className:'w-sub'},'Karim Bensalem · Apple iPhone 12')),'',h('div',null,M(14000),h('span',{className:'w-sub'},'4d ago'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('TKT-2026-0184'),C('ticket','done'),C('priority','low')),h('span',{className:'w-sub'},'Nour El Houda · HP ProBook 450')),'',h('div',null,M(6000),h('span',{className:'w-sub'},'1d ago'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('TKT-2026-0183'),C('ticket','diagnosing'),C('priority','normal')),h('span',{className:'w-sub'},'Ilyes Amrani · Sony PS4 Slim')),'',h('div',null,'—',h('span',{className:'w-sub'},'0d ago'))]]})),
    h(W.Card,{key:2,title:'Recent Sales',flush:true},h(W.Table,{clickable:true,columns:[{label:''},{label:'',end:true}],rows:[
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('INV-2026-0412'),C('sale','credit')),h('span',{className:'w-sub'},'Mourad Kacemi · 4 items')),h('div',null,M(45000),h('span',{className:'w-sub'},'14:05'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('INV-2026-0411'),C('sale','completed')),h('span',{className:'w-sub'},'Walk-in · 2 items')),h('div',null,M(2000),h('span',{className:'w-sub'},'12:31'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('INV-2026-0410'),C('sale','completed')),h('span',{className:'w-sub'},'Sofiane Meziane · 1 items')),h('div',null,M(6000),h('span',{className:'w-sub'},'11:02'))],
      [h('div',null,h('div',{className:'w-row',style:{gap:6}},code('INV-2026-0409'),C('sale','refunded')),h('span',{className:'w-sub'},'Walk-in · 1 items')),h('div',null,M(3500),h('span',{className:'w-sub'},'09:47'))]]}))]))]));
</script>

</html>
