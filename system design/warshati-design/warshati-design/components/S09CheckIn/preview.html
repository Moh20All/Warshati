<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S09CheckIn — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

var dlg=h(W.Modal,{size:'lg',title:'New Check-In',footer:h(F,null,h(W.Button,{variant:'outline'},'Cancel'),h(W.Button,{variant:'flux'},'Create Check-In'))},
  h('div',{className:'w-card',style:{padding:12,background:'var(--color-muted)'}},h('div',{className:'w-grid2'},h(W.Input,{label:'Client Name',required:true,value:'Sara Bouzid',autoFocus:true}),h(W.Input,{label:'Phone (optional)',placeholder:'Phone number if available...'}))),
  h(W.DevicePicker,{brand:'Xiaomi',model:'Redmi Note 13'}),
  h('div',{className:'w-grid2'},h(W.Input,{label:'IMEI (optional)',mono:true}),h(W.Input,{label:'Color',value:'Black'})),
  h(W.Input,{label:'Issue Description',required:true,multiline:true,rows:2,value:'Only charges when the cable is held at an angle'}),
  h(W.Input,{label:'Visible Condition',placeholder:'Scratches on screen, dent on corner...'}));
mount(shell({active:'checkin',crumbs:['Repairs','Check-In'],user:'Yacine',role:'staff',overlay:dlg},[
  h(W.PageHeader,{key:1,title:'Check-In',subtitle:'Fast device intake',actions:h(W.Button,{icon:'plus'},'New Check-In')}),
  h(F,{key:2},tbl([{label:'CI #'},{label:'Customer'},{label:'Device'},{label:'Issue'},{label:'Status'},{label:'Date'},{label:''}],[[code('CI-2026-0214'),sub('Mourad K.','0770 45 12 98'),'Apple iPhone 13','Low earpiece volume',C('checkin','pending'),'24/10',act([['print','Print'],['chev-end','Convert to Ticket']])]]))]));
</script>
</body>
</html>
