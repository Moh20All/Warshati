<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S01Activation — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

mount(h('div',{className:'w-root',style:{width:1366,height:768,background:'var(--color-background)',position:'relative'}},
  h('div',{className:'w-row',style:{position:'absolute',top:24,insetInlineStart:24}},h('img',{src:MARK,width:32}),h('b',null,'Warshati')),
  h('div',{style:{position:'absolute',inset:0,display:'grid',placeItems:'center'}},h('div',{className:'w-card',style:{width:460,overflow:'hidden'}},
    h('div',{style:{background:'var(--color-inverse)',color:'var(--color-inverse-foreground)',padding:'20px 24px',display:'flex',gap:14,alignItems:'center',position:'relative',overflow:'hidden'}},
      h('svg',{width:460,height:84,style:{position:'absolute',top:0,insetInlineStart:0}},h('circle',{cx:430,cy:0,r:60,style:{fill:'var(--color-flux)'}})),
      h('span',{style:{width:40,height:40,borderRadius:8,background:'var(--color-inverse-raised)',display:'grid',placeItems:'center',position:'relative'}},I('key',20)),
      h('div',{style:{position:'relative'}},h('div',{style:{fontSize:17,fontWeight:600}},'Software Activation'),h('div',{style:{fontSize:13,opacity:.8}},'Enter your 16-character license key'))),
    h('div',{className:'w-col',style:{padding:24}},
      h(W.Alert,{tone:'warning',title:'License Deactivated'},'This license is registered to a different device. Please contact support.'),
      h(W.Alert,{tone:'error'},'Invalid license key. Please check for typos.'),
      h(W.Input,{label:'License Key',required:true,mono:true,center:true,placeholder:'WARSHATI-XXXX-XXXX-XXXX-XXXX',value:'WARSHATI-K9Q2-7HXM-PL4R-2WZ8'}),
      h(W.Button,{variant:'flux',size:'lg',block:true,icon:'key'},'Activate Device'),
      h('div',{className:'w-hint',style:{textAlign:'center'}},'Need a license? Contact Warshati administrative support.'))))));
</script>
</body>
</html>
