<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S15Invoices — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

var rows=[['INV-2026-0412','Mourad Kacemi','0770 45 12 98',45000,'SPLIT','credit'],['INV-2026-0411','Walk-in','',2000,'CASH','completed'],['INV-2026-0410','Sofiane Meziane','0698 77 66 55',6000,'CASH','completed'],['INV-2026-0409','Walk-in','',3500,'CASH','refunded']];
var dlg=h(W.Modal,{size:'md',title:'Refund sale INV-2026-0410',footer:h(F,null,h(W.Button,{variant:'outline'},'Cancel'),h(W.Button,{variant:'danger'},'Confirm Refund'))},
  h('div',{className:'w-row',style:{justifyContent:'space-between'}},h('span',null,'Money to give back'),h('b',{className:'stat-value'},M(6000))),
  h('div',{className:'w-card',style:{padding:10,fontSize:13}},'1 × Batterie externe 10 000 mAh'),h('div',{className:'w-hint'},'Items will be put back in stock.'),h(W.Input,{label:'Reason (optional)'}));
mount(shell({active:'invoices',crumbs:['Sales','Invoices'],overlay:dlg},[
  h(W.PageHeader,{key:1,title:'Invoices',subtitle:'All sales history',actions:h(W.Button,{variant:'outline',icon:'download'},'Export to Excel')}),
  h(F,{key:2},search('Search invoice #, customer...')),
  h(F,{key:3},tbl([{label:'Invoice #'},{label:'Customer'},{label:'Total',end:true},{label:'Payment'},{label:'Status'},{label:'Date'},{label:'',end:true}],rows.map(r=>[code(r[0]),r[2]?sub(r[1],r[2]):h('span',{className:'w-muted'},r[1]),M(r[3]),h(W.Badge,null,r[4]),r[5]==='refunded'?h('div',null,C('sale','refunded'),h('span',{className:'w-sub'},'Refunded on 24/10')):C('sale',r[5]),'24/10',act(r[5]==='refunded'?[['print','Print']]:[['undo','Refund'],['print','Print']])])))]));
</script>
</body>
</html>
