<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Alert — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
mount(h('div',{className:'w-root pv'},
  h(W.Alert,{tone:'error'},'Invalid license key. Please check for typos.'),
  h(W.Alert,{tone:'warning',title:'License Deactivated'},'This license is registered to a different device. Please contact support.'),
  h(W.Alert,{tone:'warning',action:h(W.Button,{size:'sm',variant:'outline',icon:'wallet'},'Record the rest as a debt')},'3 500 DZD is missing.'),
  h('div',{dir:'rtl'},h(W.Alert,{tone:'success'},'تم التنشيط بنجاح'))));
</script>
</body>
</html>
