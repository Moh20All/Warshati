<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S05Customers — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

var rows=[['Amina Haddad','0661 23 45 67','amina.h@gmail.com',12,3,1],['Karim Bensalem','0550 11 22 33','—',4,6,0],['Mourad Kacemi','0770 45 12 98','—',9,11,2],['Sofiane Meziane','0698 77 66 55','sofiane.m@yahoo.fr',2,1,1],['Nour El Houda B.','0770 99 88 77','—',6,2,0],['Ilyes Amrani','0555 31 42 53','—',1,0,0]];
var dlg=h(W.Modal,{size:'md',title:'New Customer',footer:h(F,null,h(W.Button,{variant:'outline'},'Annuler'),h(W.Button,null,'Créer'))},h(W.Input,{label:'Nom',required:true,value:'Yasmine Boudiaf'}),h(W.Input,{label:'Téléphone',required:true,value:'0661 23 45 67',error:'Phone number already exists'}),h(W.Input,{label:'Email (optional)',placeholder:'client@email.com'}),h(W.Input,{label:'Notes',multiline:true,rows:2,placeholder:'Optional notes...'}));
mount(shell({lang:'fr',active:'customers',crumbs:['customers'],overlay:dlg},[
  h(W.PageHeader,{key:1,title:'Clients',subtitle:'Manage your customer base',actions:h(W.Button,{icon:'plus'},'Nouveau Client')}),
  h(F,{key:2},search('Search by name, phone, or email...')),
  h(F,{key:3},tbl([{label:'Name'},{label:'Email'},{label:'Repairs'},{label:'Sales'},{label:'Debt'}],rows.map(r=>[sub(h('b',null,r[0]),r[1]),r[2],r[3],r[4],r[5]?h(W.Badge,{variant:'warning'},r[5]+' ouvert'):h(W.Badge,null,'Aucun')])))]));
</script>
</body>
</html>
