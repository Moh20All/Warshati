<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>SegmentedSwitch — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
mount(h('div',{className:'w-root pv'},h('div',{className:'w-row',style:{gap:16}},
  h(W.SegmentedSwitch,{options:[{value:'phone',label:'Phone',icon:'phone'},{value:'laptop',label:'Laptop',icon:'laptop'},{value:'console',label:'Console',icon:'gamepad'}]}),
  h(W.SegmentedSwitch,{value:'split',options:[{value:'cash',label:'Cash'},{value:'credit',label:'Credit (Full)'},{value:'split',label:'Split (Cash + Credit)'}]})),
  h('div',{dir:'rtl'},h(W.SegmentedSwitch,{options:[{value:'existing',label:'زبون موجود'},{value:'new',label:'زبون جديد'}]}))));
</script>
</body>
</html>
