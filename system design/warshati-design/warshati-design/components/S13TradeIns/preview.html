<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>S13TradeIns — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
function shell(o,kids){return h(W.AppShell,Object.assign({logo:MARK,user:'Karim'},o),kids);}
function grid(n,kids,st){return h('div',{style:Object.assign({display:'grid',gridTemplateColumns:'repeat('+n+', minmax(0, 1fr))',gap:16},st||{})},kids);}
function search(ph,extra){return h('div',{className:'w-row',style:{flexWrap:'nowrap'}},h('div',{style:{flex:1,maxWidth:420}},h(W.Input,{leftIcon:'search',placeholder:ph})),extra);}
function tbl(cols,rows,o){return h('div',{className:'w-card',style:{overflow:'hidden'}},h(W.Table,Object.assign({columns:cols,rows:rows,clickable:true},o||{})));}
function act(icons){return h('span',{className:'w-row',style:{gap:2,justifyContent:'flex-end',flexWrap:'nowrap'}},icons.map((x,i)=>h(W.Button,{key:i,variant:'ghost',size:'sm',iconOnly:!x[2],icon:x[0],label:x[1],className:x[3]},x[2]?x[1]:null)));}

var dlg=h(W.Modal,{size:'lg',title:'Appraise Trade-In',footer:h(F,null,h(W.Button,{variant:'outline'},'Cancel'),h(W.Button,{variant:'flux'},'Appraise'))},
  h(W.Input,{label:'Customer Name',required:true,value:'Hichem Djaballah'}),
  h(W.DevicePicker,{brand:'Apple',model:'iPhone 12',picked:true}),
  h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:12}},h(W.Input,{label:'IMEI',mono:true,value:'353912110458721'}),h(W.Input,{label:'Storage',value:'128GB',placeholder:'128GB'}),h(W.Input,{label:'Color',value:'Blue'})),
  h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1.4fr',gap:12}},h(W.Select,{label:'Condition',value:'Good',options:['Excellent','Good','Fair','Poor','Broken']}),h(W.MoneyInput,{label:'Appraised Value (DZD)',required:true,value:52000}),h(W.Select,{label:'Payout',value:'Cash paid from the drawer',options:['Cash paid from the drawer','Store credit (deduct at POS)']})),
  h(W.Input,{label:'Condition Notes',placeholder:'Scratches, battery health...',value:'Battery 84 %, light scratch on frame'}));
mount(shell({active:'tradeins',crumbs:['Repairs','Trade-Ins'],overlay:dlg},[
  h(W.PageHeader,{key:1,title:'Trade-Ins',subtitle:'Appraise and accept used devices',actions:h(W.Button,{icon:'plus'},'New Trade-In')}),
  h(F,{key:2},tbl([{label:'Customer'},{label:'Device'},{label:'IMEI'},{label:'Condition'},{label:'Value',end:true},{label:'Status'},{label:'Date'}],[['Walid Ferhat','Apple iPhone 11',code('352211098765432'),C('condition','good'),M(42000),C('tradein','accepted'),'21/10']]))]));
</script>
</body>
</html>
