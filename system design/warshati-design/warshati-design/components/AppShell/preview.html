<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>AppShell — preview</title>

<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
mount(h(W.AppShell,{active:'dashboard',logo:MARK,crumbs:['Dashboard'],user:'Karim',toast:h(W.Toast,{tone:'success'},'Store settings saved')},h(W.PageHeader,{title:'Page title',subtitle:'Page subtitle'}),h(W.Card,null,h('p',{className:'w-muted',style:{margin:0}},'The page area has 24 px padding, as in the app.'))));
</script>
