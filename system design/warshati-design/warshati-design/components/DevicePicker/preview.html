<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>DevicePicker — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
var models=[{label:'Galaxy A54',sub:'8 GB / 256 GB · 5000 mAh · 6.4" · 5G',photo:true},{label:'Galaxy A55',sub:'8 GB / 128 GB · 5000 mAh · 6.6" · 5G',photo:true},{label:'Galaxy A5 (2016)',sub:'',photo:true,badge:'added by hand'},{label:'Use "a5" (type manually)',manual:true,photo:true}];
mount(h('div',{className:'w-root pv',style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}},
  h(W.DevicePicker,{brand:'Samsung',openList:'model',query:'a5',modelItems:models,picked:false}),
  h('div',{dir:'rtl'},h(W.DevicePicker,{lang:'ar',manual:true,brand:'Infinix',model:'Hot 40i'}))));
</script>
</body>
</html>
