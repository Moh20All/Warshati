<!doctype html>
<html lang="fr" data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Combobox — preview</title>
<style>html,body{margin:0;background:var(--color-background);color:var(--color-foreground);} .pv{padding:16px;display:flex;flex-direction:column;gap:12px;}</style></head>
<body>
<div id="root"></div>
<script>
var W=window.Warshati,h=React.createElement,F=React.Fragment;
var MARK='../../assets/mark-trace-tile.svg';
function mount(x){ReactDOM.createRoot(document.getElementById('root')).render(x);}
function M(v,l){return h(W.Money,{value:v,lang:l||'en'});}
function C(k,v,l){return h(W.StatusBadge,{kind:k,value:v,lang:l||'en'});}
function sub(a,b){return h('div',null,a,h('span',{className:'w-sub'},b));}
function I(n,s){return h(W.Icon,{name:n,size:s});}
function code(x){return h('span',{className:'w-code'},x);}
mount(h('div',{className:'w-root pv',style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}},
  h(W.Field,{label:'Customer'},h(W.Combobox,{open:true,query:'ami',placeholder:'Choose a customer...',items:[{label:'Amina Haddad',sub:'0661 23 45 67'},{label:'Amine Belkacem',sub:'0550 98 76 54'},{label:'Samia Ouali',sub:'0770 12 34 56'}]})),
  h('div',{dir:'rtl'},h(W.Field,{label:'العلامة'},h(W.Combobox,{open:true,query:'',placeholder:'اختر العلامة...',highlight:1,items:[{label:'Apple',count:'48 models'},{label:'Samsung',count:'112 models'},{label:'Xiaomi',count:'96 models'},{label:'Oppo',count:'54 models'}]})))));
</script>
</body>
</html>
